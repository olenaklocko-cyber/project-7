<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Дзен-Хаб для фокуса</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Повноекранний дощ -->
    <div id="rain-fullscreen" class="rain-fullscreen">
        <div class="rain-image"></div>
        <div class="rain-overlay"></div>
        <div class="rain-drops-layer"></div>
        <button class="rain-close">✕</button>
    </div>
    
    <!-- Повноекранний вогонь -->
    <div id="fire-fullscreen" class="fire-fullscreen">
        <div class="fire-image"></div>
        <div class="fire-overlay"></div>
        <div class="fire-sparks-layer"></div>
        <button class="fire-close">✕</button>
    </div>
    
    <!-- Анімації фону -->
    <div id="background-effects">
        <div id="fire-container" class="effect-container"></div>
        <div id="cat-container" class="effect-container"></div>
    </div>
    
    <div id="app">
        <!-- 4 квадрати звуків -->
        <div class="sounds-columns">
            <div class="sound-column" data-sound="rain" id="rain-card">
                <div class="rain-bg"></div>
                <div class="sound-content">
                    <div class="sound-icon">🌧️</div>
                    <div class="sound-name">Дощ</div>
                    <div class="volume-slider">
                        <input type="range" min="0" max="100" value="50" class="slider">
                    </div>
                </div>
            </div>
            
            <div class="sound-column" data-sound="fire">
                <div class="fire-bg"></div>
                <div class="sound-content">
                    <div class="sound-icon">🔥</div>
                    <div class="sound-name">Вогонь</div>
                    <div class="volume-slider">
                        <input type="range" min="0" max="100" value="50" class="slider">
                    </div>
                </div>
            </div>
            
            <div class="sound-column" data-sound="cat">
                <div class="sound-content">
                    <div class="sound-icon">🐱</div>
                    <div class="sound-name">Кіт</div>
                    <div class="volume-slider">
                        <input type="range" min="0" max="100" value="50" class="slider">
                    </div>
                </div>
            </div>
            
            <div class="sound-column" data-sound="whitenoise">
                <div class="sound-content">
                    <div class="sound-icon">☁️</div>
                    <div class="sound-name">Білий шум</div>
                    <div class="volume-slider">
                        <input type="range" min="0" max="100" value="50" class="slider">
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Таймер поверх колонок -->
        <div class="timer-overlay">
            <div class="timer-square">
                <div class="timer-time" id="timer-time">25:00</div>
                <div class="timer-label" id="timer-label">ФОКУС</div>
            </div>
        </div>
        
        <!-- Контроли знизу -->
        <div class="controls-bottom">
            <div class="timer-presets">
                <button class="preset-btn" data-minutes="5">5</button>
                <button class="preset-btn active" data-minutes="15">15</button>
                <button class="preset-btn" data-minutes="25">25</button>
            </div>
            
            <div class="timer-controls">
                <button class="control-btn start" id="btn-start">▶ Старт</button>
                <button class="control-btn pause" id="btn-pause">⏸ Пауза</button>
                <button class="control-btn reset" id="btn-reset">↻ Скинути</button>
            </div>
        </div>
    </div>
    
    <script src="sounds.js"></script>
    <script src="timer.js"></script>
    <script src="effects.js"></script>
    <script src="app.js"></script>
</body>
</html>
